4. Có nút backup/import private key PKCS8; giải thích file backup phải giữ kín.
5. Giữ khóa vừa tạo khi gửi lỗi mạng để retry; không ghi đè khóa đã có một cách im lặng.
6. Khi thành công chuyển login; private key không gửi backend. Escape nội dung hiển thị bằng textContent.

TỰ KIỂM TRA:
Khóa vẫn có sau reload; public key gửi lên khớp private; gọi API đúng tên /activate.
