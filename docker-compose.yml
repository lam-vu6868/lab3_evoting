# FILE: docker-compose.yml
# MỤC ĐÍCH: Chỉ chạy PostgreSQL trong Docker, chưa build hoặc chạy frontend/backend.
# CÁCH DÙNG / VIỆC CẦN LÀM:
# 1. Chạy docker compose up -d; dùng image postgres:16-alpine có sẵn, không cần build.
# 2. pgdata giữ dữ liệu; db/ mount read-only để init khi volume mới.
# 3. Máy local kết nối 127.0.0.1:5432, database evoting; password lấy từ .env.
# 4. Backend/frontend sẽ chạy local sau khi được viết; không có bước build ứng dụng.
# ĐỌC KÈM: docs/STRUCTURE.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: evoting_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: evoting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      # Truyền cho db/01_roles.sh để tạo role -> KHÔNG hard-code password trong SQL
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD}
      TALLY_USER_PASSWORD: ${TALLY_USER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume: không dính lỗi quyền trên host
      - ./db:/docker-entrypoint-initdb.d:ro # chạy theo thứ tự tên: 01_roles.sh -> init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evoting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
